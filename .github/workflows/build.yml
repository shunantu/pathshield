name: Build pathshield.ko

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '4.19 kernel source repository'
        required: false
        default: 'UtsavBalar1231/kernel_xiaomi_sm8250'
      kernel_ref:
        description: 'branch / tag'
        required: false
        default: 'android11-stable'
      kernel_config:
        description: 'defconfig bare name (empty = auto-detect)'
        required: false
        default: ''
      force_vermagic:
        description: 'UTS_RELEASE to write into the tree'
        required: false
        default: '4.19.152-perf+'

env:
  KSRC: /home/runner/ksrc
  CROSS: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          sudo apt-get clean
          df -h /

      - name: Install aarch64 cross gcc
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex \
            libssl-dev libelf-dev python3 python-is-python3 \
            zip unzip xz-utils cpio rsync git wget curl \
            device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      - name: Clone kernel source
        run: |
          set -e
          REPO="${{ github.event.inputs.kernel_repo || 'UtsavBalar1231/kernel_xiaomi_sm8250' }}"
          REF="${{ github.event.inputs.kernel_ref || 'android11-stable' }}"
          echo "repo=$REPO ref=$REF dest=$KSRC"
          rm -rf "$KSRC"
          if git clone --depth=1 --branch "$REF" "https://github.com/$REPO.git" "$KSRC"; then
            echo 'cloned with explicit branch'
          else
            echo '::warning::branch missing, using default'
            rm -rf "$KSRC"
            git clone --depth=1 "https://github.com/$REPO.git" "$KSRC"
          fi
          cd "$KSRC"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' Makefile
          du -sh "$KSRC"

      - name: Configure kernel
        run: |
          set -e
          cd "$KSRC"
          CFG="${{ github.event.inputs.kernel_config || '' }}"
          if [ -z "$CFG" ]; then
            for c in vendor/kona-perf_defconfig vendor/kona_defconfig defconfig; do
              if [ -f "arch/arm64/configs/$c" ]; then CFG="$c"; break; fi
            done
          fi
          if [ -z "$CFG" ]; then
            echo '::error::no defconfig found'
            ls arch/arm64/configs/ | head -40
            exit 1
          fi
          echo "defconfig: $CFG"
          if ! make ARCH=arm64 CROSS_COMPILE=$CROSS O=out "$CFG"; then
            echo '::warning::defconfig failed, falling back'
            rm -rf out
            CFG=defconfig
            make ARCH=arm64 CROSS_COMPILE=$CROSS O=out defconfig
          fi
          [ -f out/.config ] || { echo '::error::out/.config missing'; exit 1; }
          echo "config lines: $(wc -l < out/.config)"
          ./scripts/config --file out/.config \
            -d LTO -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL \
            -d CFI_CLANG -d SHADOW_CALL_STACK \
            -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES \
            -d MODULE_SIG -d MODULE_SIG_ALL -d MODULE_SIG_FORCE \
            -d TRIM_UNUSED_KSYMS \
            -e MODULES -e MODULE_UNLOAD -e MODVERSIONS \
            -e KALLSYMS -e KALLSYMS_ALL 2>/dev/null || true
          make ARCH=arm64 CROSS_COMPILE=$CROSS O=out olddefconfig
          grep -E '^CONFIG_(MODULES|MODULE_UNLOAD|MODVERSIONS|MODULE_SIG|KALLSYMS|LTO|CFI_CLANG|DEBUG_INFO_BTF)=' out/.config || true

      - name: Prepare
        run: |
          set +e
          cd "$KSRC"
          make ARCH=arm64 CROSS_COMPILE=$CROSS O=out -j1 modules_prepare > /tmp/prepare.log 2>&1
          RC=$?
          echo "rc=$RC"
          if [ $RC -ne 0 ]; then
            echo "================ modules_prepare FAILED (rc=$RC) ================"
            grep -n -E "error:|Error [0-9]|No such file|cannot" /tmp/prepare.log | head -40
            echo "---- tail ----"
            tail -40 /tmp/prepare.log
            echo "================ END DIAGNOSTICS ================"
            echo '::error::modules_prepare failed'
            exit 1
          fi
          echo 'prepare ok'

      - name: Force vermagic
        run: |
          set -e
          cd "$KSRC"
          VM="${{ github.event.inputs.force_vermagic || '4.19.152-perf+' }}"
          UTS=out/include/generated/utsrelease.h
          echo "target vermagic: $VM"
          if [ -f "$UTS" ]; then
            echo '--- before ---'; cat "$UTS"
            printf '#define UTS_RELEASE "%s"\n' "$VM" > "$UTS"
            echo '--- after ---'; cat "$UTS"
          else
            echo '::error::utsrelease.h missing'
            find out/include -name 'utsrelease*' | head
            exit 1
          fi

      - name: Build vmlinux
        run: |
          set +e
          cd "$KSRC"

          # 4.19 upstream was never built with gcc >= 10. Ubuntu 22.04 ships
          # gcc 11.4, which turns a pile of old warnings into hard errors
          # (-Wdesignated-init, -Wstringop-overflow, -Warray-bounds, ...).
          # KCFLAGS=-Wno-error demotes every one of them back to a warning.
          KCFLAGS="-Wno-error -Wno-designated-init -Wno-stringop-overflow -Wno-array-bounds -Wno-address-of-packed-member"

          make ARCH=arm64 CROSS_COMPILE=$CROSS O=out -j$(nproc) \
               KCFLAGS="$KCFLAGS" vmlinux > /tmp/vmlinux.log 2>&1
          RC=$?
          echo "rc=$RC"

          if [ ! -f out/vmlinux.symvers ]; then
            # 关键：诊断必须放在 stdout 的最后几行。
            # GitHub 折叠视图只显示末尾，之前写进 STEP_SUMMARY 需要点击才看得到。
            echo "================ vmlinux FAILED (rc=$RC) ================"
            echo "---- first 40 error lines ----"
            grep -n -E "error:|Error [0-9]" /tmp/vmlinux.log | head -40
            echo "---- last 40 lines ----"
            tail -40 /tmp/vmlinux.log
            echo "================ END DIAGNOSTICS ================"
            echo "::error::vmlinux.symvers not produced (rc=$RC)"
            exit 1
          fi
          ln -sf vmlinux.symvers out/Module.symvers
          echo "symvers: $(wc -l < out/vmlinux.symvers) symbols"

      - name: Build pathshield.ko
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/kernel"
          make -C "$KSRC" M="$GITHUB_WORKSPACE/kernel" ARCH=arm64 CROSS_COMPILE=$CROSS \
               O="$KSRC/out" KCFLAGS="-Wno-error" modules > /tmp/module.log 2>&1
          RC=$?
          echo "rc=$RC"
          if [ $RC -ne 0 ] || ! ls *.ko >/dev/null 2>&1; then
            echo "================ module build FAILED (rc=$RC) ================"
            grep -n -E "error:|Error [0-9]" /tmp/module.log | head -40
            echo "---- tail ----"
            tail -40 /tmp/module.log
            echo "================ END DIAGNOSTICS ================"
            echo '::error::module build failed'
            exit 1
          fi
          ls -la *.ko

      - name: Inspect module
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          KO=$(ls *.ko | head -1)
          {
            echo '## pathshield.ko'
            echo ''
            echo "- file: $KO"
            echo "- size: $(stat -c%s "$KO") bytes"
            echo ''
            echo '### vermagic'
            aarch64-linux-gnu-readelf -p .modinfo "$KO" | grep -E 'vermagic|name=|depends' || true
            echo ''
            echo '### undefined symbols'
            aarch64-linux-gnu-nm -u "$KO" | sed 's/^ *U *//' | sort | head -60 || true
          } | tee /tmp/inspect.txt
          cat /tmp/inspect.txt >> $GITHUB_STEP_SUMMARY
          echo 'reference: device kernelsu.ko = 270512 bytes'

      - name: Collect artifact
        run: |
          mkdir -p out
          cp "$GITHUB_WORKSPACE"/kernel/*.ko out/ 2>/dev/null || true
          cp /tmp/prepare.log /tmp/vmlinux.log /tmp/module.log /tmp/inspect.txt out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: pathshield-build
          path: out/
          if-no-files-found: warn
