name: Build pathshield.ko

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '4.19 kernel source repository'
        required: false
        default: 'UtsavBalar1231/kernel_xiaomi_sm8250'
      kernel_ref:
        description: 'branch / tag / commit'
        required: false
        default: 'android14-stable'
      kernel_config:
        description: 'defconfig target (empty = try common ones)'
        required: false
        default: ''

env:
  # 内核源码克隆到 workspace 之外的目录，避免和本仓库的 kernel/ 冲突
  KSRC: /home/runner/ksrc

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          sudo apt-get clean
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex             libssl-dev libelf-dev python3 python-is-python3             zip unzip xz-utils cpio rsync git wget curl

      - name: Fetch prebuilt clang (r383902b = clang 10.0.5)
        run: |
          set -e
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz"
          mkdir -p $HOME/clang
          wget -q --tries=3 --timeout=60 -O /tmp/clang.tar.gz "$URL"
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          $HOME/clang/bin/clang --version

      - name: Clone kernel source
        run: |
          set -e
          REPO="${{ github.event.inputs.kernel_repo || 'UtsavBalar1231/kernel_xiaomi_sm8250' }}"
          REF="${{ github.event.inputs.kernel_ref || 'android14-stable' }}"
          echo "repo=$REPO ref=$REF dest=$KSRC"

          rm -rf "$KSRC"
          if git clone --depth=1 --branch "$REF" "https://github.com/$REPO.git" "$KSRC"; then
            echo "cloned with explicit branch"
          else
            echo "::warning::branch '$REF' not found, falling back to default branch"
            rm -rf "$KSRC"
            git clone --depth=1 "https://github.com/$REPO.git" "$KSRC"
          fi

          du -sh "$KSRC"
          ls "$KSRC" | head -30

      - name: Prepare kernel build
        run: |
          set -e
          export PATH=$HOME/clang/bin:$PATH
          cd "$KSRC"

          # 找一个能用的 defconfig
          CFG="${{ github.event.inputs.kernel_config || '' }}"
          if [ -z "$CFG" ]; then
            for c in vendor/kona-perf_defconfig vendor/kona_defconfig                      arch/arm64/configs/vendor/kona-perf_defconfig                      arch/arm64/configs/vendor/kona_defconfig                      arch/arm64/configs/defconfig; do
              if [ -f "$c" ] || [ -f "arch/arm64/configs/$c" ]; then CFG="$c"; break; fi
            done
          fi
          if [ -z "$CFG" ]; then
            echo "::error::no usable defconfig found"
            ls arch/arm64/configs/ | head -20 || true
            exit 1
          fi
          echo "using defconfig: $CFG"

          MAKE="make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 O=out"
          $MAKE $CFG
          # 关掉 LTO/CFI：外部模块链接不需要，而且极耗内存
          ./scripts/config --file out/.config             -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL             -d CFI_CLANG -d SHADOW_CALL_STACK 2>/dev/null || true
          $MAKE olddefconfig

          echo "--- key config ---"
          grep -E 'CONFIG_MODULES=|CONFIG_MODULE_SIG|CONFIG_MODVERSIONS|CONFIG_LOCALVERSION' out/.config || true

          # 只需要 vmlinux.symvers，不需要完整 vmlinux 镜像
          $MAKE -j$(nproc) vmlinux 2>&1 | tail -40 || {
            echo "::warning::vmlinux build had errors, checking for symvers anyway"
          }

          if [ -f out/vmlinux.symvers ]; then
            ln -sf vmlinux.symvers out/Module.symvers
            echo "Module.symvers ready: $(wc -l < out/vmlinux.symvers) symbols"
          else
            echo "::error::out/vmlinux.symvers not produced"
            ls -la out/ | tail -30
            exit 1
          fi

      - name: Build pathshield.ko
        run: |
          set -e
          export PATH=$HOME/clang/bin:$PATH
          cd "$GITHUB_WORKSPACE/kernel"
          make -C "$KSRC" M="$GITHUB_WORKSPACE/kernel"             ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 O="$KSRC/out" modules             2>&1 | tee /tmp/build.log | tail -60
          ls -la *.ko

      - name: Inspect module
        run: |
          set -e
          export PATH=$HOME/clang/bin:$PATH
          cd "$GITHUB_WORKSPACE/kernel"
          KO=$(ls *.ko | head -1)
          echo "=== $KO ==="
          ls -l "$KO"
          echo ""
          echo "=== vermagic ==="
          $HOME/clang/bin/llvm-readelf -p .modinfo "$KO" | grep -E 'vermagic|name=' || true
          echo ""
          echo "=== sections ==="
          $HOME/clang/bin/llvm-readelf -S "$KO" | grep -E '__versions|.text|.modinfo' || true
          echo ""
          echo "=== undefined symbols ==="
          $HOME/clang/bin/llvm-nm -u "$KO" | head -40 || true

      - name: Collect artifact
        run: |
          mkdir -p out
          cp "$GITHUB_WORKSPACE"/kernel/*.ko out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: pathshield-ko
          path: out/*.ko
          if-no-files-found: error
